name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - id: source
        name: Bind the release to one source commit
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$commit"
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "${RELEASE_TAG#v}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)" = "${RELEASE_TAG#v}"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and cannot be replaced." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            key: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            key: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            key: windows
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
      - name: Verify the tag points at the release source
        shell: bash
        run: |
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.commit }}"
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libclang-dev clang libgbm-dev file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
        with:
          args: --target ${{ matrix.target }}
      - name: Stage macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir staged
          version="${RELEASE_TAG#v}"
          dmg="$(find src-tauri/target/${{ matrix.target }}/release/bundle -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "staged/Screen-Landmark-Lens_${version}_${{ matrix.key }}.dmg"
          app="$(find src-tauri/target/${{ matrix.target }}/release/bundle -type d -name '*.app' -print -quit)"
          test -d "$app"
          details="$(codesign -dv --verbose=4 "$app" 2>&1 || true)"
          if printf '%s' "$details" | grep -q '^Authority='; then echo "Unexpected publisher signature" >&2; exit 1; fi
          printf '{"platform":"%s","publisherSigned":false}\n' "${{ matrix.key }}" > "staged/${{ matrix.key }}.signature.json"
          printf '{"platform":"%s","tag":"%s","commit":"%s"}\n' "${{ matrix.key }}" "$RELEASE_TAG" "$(git rev-parse HEAD)" > "staged/${{ matrix.key }}.source.json"
      - name: Stage Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir staged
          version="${RELEASE_TAG#v}"
          for extension in AppImage deb rpm; do
            asset="$(find src-tauri/target/${{ matrix.target }}/release/bundle -type f -iname "*.${extension}" -print -quit)"
            if test -n "$asset"; then cp "$asset" "staged/Screen-Landmark-Lens_${version}_linux.${extension}"; fi
          done
          test -f "staged/Screen-Landmark-Lens_${version}_linux.AppImage"
          test -f "staged/Screen-Landmark-Lens_${version}_linux.deb"
          test -f "staged/Screen-Landmark-Lens_${version}_linux.rpm"
          if ar t "staged/Screen-Landmark-Lens_${version}_linux.deb" | grep -q '_gpgorigin'; then echo "Unexpected package signature" >&2; exit 1; fi
          printf '{"platform":"linux","publisherSigned":false}\n' > staged/linux.signature.json
          printf '{"platform":"linux","tag":"%s","commit":"%s"}\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" > staged/linux.source.json
      - name: Stage Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staged | Out-Null
          $version = $env:RELEASE_TAG.TrimStart('v')
          $bundleRoot = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $msi = Get-ChildItem -Path $bundleRoot -Recurse -Filter *.msi | Select-Object -First 1
          $exe = Get-ChildItem -Path $bundleRoot -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $msi -or -not $exe) { throw "Expected both MSI and NSIS installers" }
          Copy-Item $msi.FullName "staged/Screen-Landmark-Lens_${version}_windows.msi"
          Copy-Item $exe.FullName "staged/Screen-Landmark-Lens_${version}_windows-setup.exe"
          $signature = Get-AuthenticodeSignature $msi.FullName
          if ($signature.Status -ne "NotSigned") { throw "Unexpected publisher signature: $($signature.Status)" }
          '{"platform":"windows","publisherSigned":false}' | Set-Content "staged/windows.signature.json"
          @{ platform = "windows"; tag = $env:RELEASE_TAG; commit = (git rev-parse HEAD) } | ConvertTo-Json -Compress | Set-Content "staged/windows.source.json"
      - name: Exercise Windows checksum installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path staged/installer-fixture.msi -Value "verified fixture"
          $hash = (Get-FileHash staged/installer-fixture.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          $port = Get-Random -Minimum 20000 -Maximum 50000
          @{ platforms = @{ windows = @{ url = "http://127.0.0.1:$port/installer-fixture.msi"; sha256 = $hash } } } | ConvertTo-Json -Depth 4 | Set-Content staged/installer-fixture.json
          $server = Start-Process py -ArgumentList "-3", "-m", "http.server", "$port", "--bind", "127.0.0.1", "--directory", "staged" -PassThru
          $ready = $false
          foreach ($attempt in 1..30) {
            if ($server.HasExited) { throw "Checksum fixture server exited before listening." }
            $probe = [System.Net.Sockets.TcpClient]::new()
            try {
              $probe.Connect("127.0.0.1", $port)
              $ready = $true
              break
            } catch {
              Start-Sleep -Milliseconds 250
            } finally {
              $probe.Dispose()
            }
          }
          if (-not $ready) { throw "Checksum fixture server did not listen on port $port." }
          try {
            $env:SLL_MANIFEST_URL = "http://127.0.0.1:$port/installer-fixture.json"
            $env:SLL_VERIFY_ONLY = "1"
            $valid = Start-Process pwsh -ArgumentList "-File", "site/public/install.ps1" -Wait -PassThru -NoNewWindow
            if ($valid.ExitCode -ne 0) { throw "Valid checksum fixture was rejected" }
            Set-Content -Path staged/installer-fixture.msi -Value "tampered fixture"
            $tampered = Start-Process pwsh -ArgumentList "-File", "site/public/install.ps1" -Wait -PassThru -NoNewWindow
            if ($tampered.ExitCode -eq 0) { throw "Tampered checksum fixture was accepted" }
            '{"platform":"windows","validAccepted":true,"tamperedRejected":true}' | Set-Content "staged/windows-installer-verification.json"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Remove-Item staged/installer-fixture.msi, staged/installer-fixture.json
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: staged/*
          if-no-files-found: error

  manifest:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
      - id: release_source
        name: Record the exact release source
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.commit }}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksum and download manifests
        run: GITHUB_SHA="${{ needs.preflight.outputs.commit }}" node scripts/make-release-manifest.mjs release-assets
      - name: Verify release manifest
        run: |
          jq -e --arg commit "${{ needs.preflight.outputs.commit }}" '.commit == $commit and .release.commit == $commit and .checksums.commit == $commit and all(.platforms[]; .commit == $commit) and .platforms.windows.url and .platforms["macos-arm64"].url and .platforms["macos-x64"].url and .platforms.linux.url' release-assets/latest.json
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Upload complete draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.release_source.outputs.commit }}
          name: Screen Landmark Lens ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          body: |
            Screen Landmark Lens desktop packages for macOS, Windows, and Linux.

            The attached latest.json records the exact source commit used for this release.

            These packages have no publisher signature. On macOS, right-click the app and choose Open.
          files: release-assets/*
      - name: Publish and lock the complete release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest
          for attempt in $(seq 1 12); do
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .immutable)" = "true" && exit 0
            sleep 5
          done
          echo "GitHub did not lock the published release." >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
