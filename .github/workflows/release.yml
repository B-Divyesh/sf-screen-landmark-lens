name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            key: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            key: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            key: windows
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libclang-dev clang libgbm-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
      - name: Stage macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir staged
          version="${RELEASE_TAG#v}"
          dmg="$(find src-tauri/target/${{ matrix.target }}/release/bundle -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "staged/Screen-Landmark-Lens_${version}_${{ matrix.key }}.dmg"
      - name: Stage Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir staged
          version="${RELEASE_TAG#v}"
          for extension in AppImage deb rpm; do
            asset="$(find src-tauri/target/${{ matrix.target }}/release/bundle -type f -iname "*.${extension}" -print -quit)"
            if test -n "$asset"; then cp "$asset" "staged/Screen-Landmark-Lens_${version}_linux.${extension}"; fi
          done
          test -f "staged/Screen-Landmark-Lens_${version}_linux.AppImage"
          test -f "staged/Screen-Landmark-Lens_${version}_linux.deb"
      - name: Stage Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staged | Out-Null
          $version = $env:RELEASE_TAG.TrimStart('v')
          $bundleRoot = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $msi = Get-ChildItem -Path $bundleRoot -Recurse -Filter *.msi | Select-Object -First 1
          $exe = Get-ChildItem -Path $bundleRoot -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $msi -or -not $exe) { throw "Expected both MSI and NSIS installers" }
          Copy-Item $msi.FullName "staged/Screen-Landmark-Lens_${version}_windows.msi"
          Copy-Item $exe.FullName "staged/Screen-Landmark-Lens_${version}_windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: staged/*
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksum and download manifests
        run: node scripts/make-release-manifest.mjs release-assets
      - name: Verify release manifest
        run: |
          jq -e '.version and .platforms.windows.url and .platforms["macos-arm64"].url and .platforms["macos-x64"].url and .platforms.linux.url' release-assets/latest.json
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Screen Landmark Lens ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            First public build of Screen Landmark Lens. All window captures and OCR stay on the device.

            These binaries are unsigned. macOS users should right-click the app and choose Open; Windows may show SmartScreen.
          files: release-assets/*
