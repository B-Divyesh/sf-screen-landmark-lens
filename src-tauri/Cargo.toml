[package]
name = "screen-landmark-lens"
version = "0.1.8"
description = "Local visual landmark finder for inaccessible software"
authors = ["Param Factory"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-screen-landmark-lens"
edition = "2021"

[lib]
name = "screen_landmark_lens_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.8.5", features = [] }
tauri-plugin-opener = "2.5.0"
xcap = "0.9.8"
ocrs = "0.12.2"
rten = "0.24.0"
image = { version = "0.25", default-features = false }

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
